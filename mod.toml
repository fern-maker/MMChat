# Config file for MMChat, a chat mod for Majora's Mask: Recompiled.

[manifest]

id = "mm_chat"
version = "0.4.0"
display_name = "MMChat"
description = """
Text chat with friends while you play. One player runs the MMChat server; everyone connects to it.

Hold L and press R during gameplay to open the chat window, which also lists who's online \
and where they are. New messages pop up in the corner while the window is closed.

The server, name and password below are filled into the chat window when the game starts."""
short_description = "Chat with friends. Hold L, press R in-game."
authors = [ "Fernando Gomez-Tagle" ]
game_id = "mm"
minimum_recomp_version = "1.2.2"

dependencies = [
]

# Listed only so MMChat can detect them: they switch save files too, so co-op refuses to run alongside them.
optional_dependencies = [
    "mm_ultimate_6_save_slots",
    "mm_ultimate_6_save_slots_cn"
]

# The runtime loads mm_chat_native.dylib / .dll / .so from the mods folder, next to the .nrm.
native_libraries = [
    { name = "mm_chat_native", funcs = [
        "chat_native_ping",
        "chat_connect",
        "chat_disconnect",
        "chat_status",
        "chat_get_error",
        "chat_get_name",
        "chat_send",
        "chat_poll",
        "chat_set_location",
        "chat_roster_version",
        "chat_roster_count",
        "chat_roster_get",
        "chat_coop_set_group",
        "chat_sync_version",
        "chat_sync_get",
        "chat_sync_get_who",
        "chat_sync_report"
    ] }
]

[inputs]
elf_path = "build/mod.elf"
mod_filename = "mm_chat"
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]
additional_files = [ ]

[[manifest.config_options]]
id = "server_address"
name = "Server"
description = "The host's address and port, e.g. 192.168.1.20:47474 or a Tailscale address."
type = "String"
default = "127.0.0.1:47474"

[[manifest.config_options]]
id = "player_name"
name = "Your Name"
description = "The name other players see. Up to 16 characters."
type = "String"
default = "Player"

[[manifest.config_options]]
id = "server_password"
name = "Server Password"
description = "Only needed if the host started the server with a password."
type = "String"
default = ""

[[manifest.config_options]]
id = "coop_mode"
name = "Co-op Save"
description = """
On: file select shows a separate co-op save file instead of your normal saves. Start a new file there; \
masks are shared with everyone in your group who uses the same co-op save name (more progression \
coming in later versions). Shared progress arrives once you've learned the Song of Time.

Changes apply the next time you reach file select. Your normal saves are never modified."""
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "coop_save_name"
name = "Co-op Save Name"
description = "Name of the co-op save file (letters, numbers, - and _). Use a different name for each group you play with."
type = "String"
default = "coop"
